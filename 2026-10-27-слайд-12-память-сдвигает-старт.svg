<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Записанный опыт сдвигает старт ближе к решению </tspan><tspan font-weight="700" fill="#4B3BDB">и убирает лишние шаги</tspan></text>
