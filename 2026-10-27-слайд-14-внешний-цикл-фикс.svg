<text x="96" y="486" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">Так мы автоматизируем кристаллизацию желаемого поведения: человек вместе с агентом</text>
<text x="96" y="518" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">общего назначения может прийти к ней и вручную. Но мы не выносим её в личный инструмент</text>
<text x="96" y="550" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">сотрудника: Cursor в облаке запускается сам, Supagent вызывает его и передаёт весь контекст</text>
