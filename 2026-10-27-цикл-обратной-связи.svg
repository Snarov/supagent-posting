<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker></defs>
<rect width="1000" height="400" fill="#fff"/>
<text x="30" y="36" font-size="20" font-weight="700" fill="#0F172A">Цикл обратной связи агента: сделать — измерить</text>
<text x="30" y="58" font-size="13" fill="#64748B">По описанию агента у Рассела и Норвига (гл. 2): следующее действие выбирается по результату анализа предыдущего.</text>
<rect x="60" y="150" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
<text x="160" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#1E3A8A">Агент</text>
<text x="160" y="212" font-size="12" text-anchor="middle" fill="#1E3A8A">выбор следующего действия</text>
<rect x="400" y="90" width="200" height="70" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="500" y="120" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">Действие</text>
<text x="500" y="140" font-size="12" text-anchor="middle" fill="#64748B">тулы, скрипт</text>
<rect x="740" y="150" width="200" height="90" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
<text x="840" y="190" font-size="16" font-weight="700" text-anchor="middle" fill="#78350F">Среда</text>
<text x="840" y="212" font-size="12" text-anchor="middle" fill="#78350F">стенд, прод, мир</text>
<rect x="400" y="260" width="200" height="70" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="500" y="290" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">Измерение</text>
<text x="500" y="310" font-size="12" text-anchor="middle" fill="#64748B">состояние, метрики, логи</text>
<path d="M260 175 Q330 120 400 125" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M600 125 Q700 120 740 175" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M800 240 Q720 295 600 295" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M400 295 Q300 295 230 240" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="160" y="268" font-size="12" text-anchor="middle" fill="#334155">анализ: что изменилось и</text>
<text x="160" y="284" font-size="12" text-anchor="middle" fill="#334155">соответствует ли цели</text>
<text x="500" y="375" font-size="13" text-anchor="middle" font-weight="700" fill="#0F172A">сделать → измерить → сделать → измерить</text>
</svg>
