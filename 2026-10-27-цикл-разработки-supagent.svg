<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker></defs>
<rect width="1000" height="360" fill="#fff"/>
<text x="30" y="36" font-size="20" font-weight="700" fill="#0F172A">Внешний цикл Supagent: от тикета до PR (схема)</text>
<g font-size="13" text-anchor="middle">
<rect x="20" y="110" width="140" height="70" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/><text x="90" y="140" font-weight="700" fill="#1E3A8A">Тикет</text><text x="90" y="160" font-size="12" fill="#1E3A8A">Supagent отвечает</text>
<rect x="190" y="110" width="140" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="260" y="140" font-weight="700" fill="#334155">Ревью</text><text x="260" y="160" font-size="12" fill="#64748B">Cursor по трейсам</text>
<rect x="360" y="110" width="140" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="430" y="140" font-weight="700" fill="#334155">Баг-карточка</text><text x="430" y="160" font-size="12" fill="#64748B">с трейсом и контекстом</text>
<rect x="530" y="110" width="140" height="70" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/><text x="600" y="140" font-weight="700" fill="#78350F">Человек</text><text x="600" y="160" font-size="12" fill="#78350F">ревью и апрув</text>
<rect x="700" y="110" width="140" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/><text x="770" y="140" font-weight="700" fill="#334155">Фикс</text><text x="770" y="160" font-size="12" fill="#64748B">Claude, по расписанию</text>
<rect x="870" y="110" width="110" height="70" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/><text x="925" y="140" font-weight="700" fill="#14532D">PR</text><text x="925" y="160" font-size="12" fill="#14532D">данные, порог, тест</text>
</g>
<g stroke="#475569" stroke-width="2" marker-end="url(#a)" fill="none">
<line x1="160" y1="145" x2="188" y2="145"/><line x1="330" y1="145" x2="358" y2="145"/><line x1="500" y1="145" x2="528" y2="145"/><line x1="670" y1="145" x2="698" y2="145"/><line x1="840" y1="145" x2="868" y2="145"/>
<path d="M925 180 Q925 290 500 290 Q90 290 90 184"/>
</g>
<text x="500" y="316" font-size="13" text-anchor="middle" fill="#334155">следующие тикеты обрабатываются уже с исправленным поведением</text>
</svg>
