<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#475569"/></marker></defs>
<rect width="1100" height="420" fill="#fff"/>
<text x="30" y="36" font-size="20" font-weight="700" fill="#0F172A">Один цикл: модель ведёт ход от начала до конца</text>
<text x="30" y="58" font-size="13" fill="#64748B">Рамки нет: что делать дальше, когда ответ готов и когда звать человека, решает сама модель.</text>
<rect x="40" y="150" width="170" height="80" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="125.0" y="186.0" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Сообщение</text>
<text x="125.0" y="208.0" font-size="12" text-anchor="middle" fill="#64748B">от клиента</text>
<rect x="330" y="130" width="300" height="120" rx="14" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2.5"/>
<text x="480" y="176" font-size="17" font-weight="700" text-anchor="middle" fill="#1E3A8A">Модель</text>
<text x="480" y="200" font-size="12" text-anchor="middle" fill="#1E3A8A">думает → вызывает инструмент →</text>
<text x="480" y="217" font-size="12" text-anchor="middle" fill="#1E3A8A">читает результат → думает ещё</text>
<rect x="350" y="80" width="260" height="30" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
<text x="480" y="100" font-size="12" text-anchor="middle" fill="#78350F">устойчивое начало запроса</text>
<path d="M480 112 L480 128" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="315" y="300" width="150" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="390.0" y="324.0" font-size="13" font-weight="700" text-anchor="middle" fill="#334155">Инструменты</text>
<text x="390.0" y="346.0" font-size="12" text-anchor="middle" fill="#64748B">поиск, память, MCP</text>
<rect x="495" y="300" width="150" height="56" rx="10" fill="#DBEAFE" stroke="#3B82F6" stroke-width="2"/>
<text x="570.0" y="324.0" font-size="13" font-weight="700" text-anchor="middle" fill="#1E3A8A">Субагенты</text>
<text x="570.0" y="346.0" font-size="12" text-anchor="middle" fill="#1E3A8A">отдельные агенты</text>
<path d="M440 252 L395 298" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<path d="M520 252 L565 298" fill="none" stroke="#475569" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
<rect x="850" y="110" width="200" height="70" rx="12" fill="#DCFCE7" stroke="#22C55E" stroke-width="2"/>
<text x="950.0" y="141.0" font-size="15" font-weight="700" text-anchor="middle" fill="#14532D">Ответ</text>
<text x="950.0" y="163.0" font-size="12" text-anchor="middle" fill="#14532D">модель сочла готовым</text>
<rect x="850" y="220" width="200" height="70" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
<text x="950.0" y="251.0" font-size="15" font-weight="700" text-anchor="middle" fill="#334155">Человеку</text>
<text x="950.0" y="273.0" font-size="12" text-anchor="middle" fill="#64748B">модель решила эскалировать</text>
<path d="M210 190 L328 190" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M632 170 L848 145" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<path d="M632 210 L848 255" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="550" y="402" font-size="13" font-weight="700" text-anchor="middle" fill="#0F172A">один контур: о следующем шаге, о готовности и об эскалации решает одна и та же модель</text>
</svg>
