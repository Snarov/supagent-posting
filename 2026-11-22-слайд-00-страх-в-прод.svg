<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-00-страх-в-прод -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="600" fill="#4B3BDB" text-anchor="start">Агента страшно пускать в прод</text>
<text x="72" y="150" font-size="24" font-weight="400" fill="#615D85" text-anchor="start">Страх конкретный, и у него три формы</text>
<rect x="280" y="180" width="720" height="150" rx="16" fill="url(#gInd)" stroke="none" stroke-width="0"/>
<text x="640.0" y="230" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Агент в собственном проде</text>
<text x="640.0" y="274" font-size="21" font-weight="400" fill="#E4E0FF" text-anchor="middle">полезного не сделает (разве что повезёт),</text>
<text x="640.0" y="304" font-size="21" font-weight="400" fill="#E4E0FF" text-anchor="middle">а сломает — наверняка</text>
<rect x="72" y="384" width="352" height="170" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="248.0" y="436" font-size="32" font-weight="700" fill="#A3223F" text-anchor="middle">DROP TABLE</text>
<text x="248.0" y="482" font-size="23" font-weight="400" fill="#615D85" text-anchor="middle">данные удалены,</text>
<text x="248.0" y="514" font-size="23" font-weight="400" fill="#615D85" text-anchor="middle">откатить нечем</text>
<path d="M480 338 L248 376" fill="none" stroke="#E5486B" stroke-width="4" stroke-linecap="round" marker-end="url(#mR)"/>
<rect x="464" y="384" width="352" height="170" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="640.0" y="436" font-size="32" font-weight="700" fill="#A3223F" text-anchor="middle">rm -rf /</text>
<text x="640.0" y="482" font-size="23" font-weight="400" fill="#615D85" text-anchor="middle">сервер сломан,</text>
<text x="640.0" y="514" font-size="23" font-weight="400" fill="#615D85" text-anchor="middle">доступ потерян</text>
<path d="M640 338 L640 376" fill="none" stroke="#E5486B" stroke-width="4" stroke-linecap="round" marker-end="url(#mR)"/>
<rect x="856" y="384" width="352" height="170" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="1032.0" y="436" font-size="32" font-weight="700" fill="#A3223F" text-anchor="middle">Счёт за токены</text>
<text x="1032.0" y="482" font-size="23" font-weight="400" fill="#615D85" text-anchor="middle">цикл без остановки</text>
<text x="1032.0" y="514" font-size="23" font-weight="400" fill="#615D85" text-anchor="middle">и без результата</text>
<path d="M800 338 L1032 376" fill="none" stroke="#E5486B" stroke-width="4" stroke-linecap="round" marker-end="url(#mR)"/>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Здесь заканчивается «просто попросить агента» и начинается </tspan><tspan font-weight="700" fill="#4B3BDB">инженерия</tspan><tspan></tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
