<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB">Что делает оператор с черновиком</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F">Три действия, и каждое работает дальше</text>
<rect x="72" y="182" width="360" height="170" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="252" y="228" font-size="30" font-weight="700" fill="#24213F" text-anchor="middle">Принять</text>
<text x="252" y="272" font-size="22" font-weight="600" fill="#24213F" text-anchor="middle">ответ уходит</text>
<text x="252" y="304" font-size="22" font-weight="600" fill="#24213F" text-anchor="middle">клиенту как есть</text>
<rect x="460" y="182" width="360" height="170" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="640" y="228" font-size="30" font-weight="700" fill="#A3223F" text-anchor="middle">Отклонить</text>
<text x="640" y="272" font-size="22" font-weight="600" fill="#24213F" text-anchor="middle">черновик клиенту</text>
<text x="640" y="304" font-size="22" font-weight="600" fill="#24213F" text-anchor="middle">не уходит</text>
<rect x="848" y="182" width="360" height="170" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="1028" y="228" font-size="30" font-weight="700" fill="#24213F" text-anchor="middle">Редактировать</text>
<text x="1028" y="272" font-size="22" font-weight="600" fill="#24213F" text-anchor="middle">словами: что не так;</text>
<text x="1028" y="304" font-size="22" font-weight="600" fill="#24213F" text-anchor="middle">агент переделывает</text>
<a href="2026-11-22-слайд-14-решение-ядро-стенд.svg">
<rect x="72" y="376" width="556" height="186" rx="16" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2"/>
<text x="100" y="426" font-size="26" font-weight="700" fill="#7A4A00" text-anchor="start">↗ Каждое действие —</text>
<text x="100" y="460" font-size="26" font-weight="700" fill="#7A4A00" text-anchor="start">кейс для тестов</text>
<text x="100" y="504" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">разметка оператора уходит</text>
<text x="100" y="534" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">в тестовый стенд</text>
</a>
<a href="2026-11-22-слайд-10-решение-память-противоречия.svg">
<rect x="652" y="376" width="556" height="186" rx="16" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2"/>
<text x="680" y="426" font-size="26" font-weight="700" fill="#7A4A00" text-anchor="start">↗ «Редактировать» —</text>
<text x="680" y="460" font-size="26" font-weight="700" fill="#7A4A00" text-anchor="start">урок в память</text>
<text x="680" y="504" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">правка откладывается в памяти</text>
<text x="680" y="534" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">агента, а не только чинит черновик</text>
</a>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Оператор не только проверяет, </tspan><tspan font-weight="700" fill="#4B3BDB">но и учит</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
