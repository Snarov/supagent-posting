<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-02-решение-доступ -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="600" fill="#4B3BDB" text-anchor="start">Права проверяет код, а не модель</text>
<text x="72" y="150" font-size="24" font-weight="400" fill="#615D85" text-anchor="start">Три источника текста, и у каждого своя граница</text>
<rect x="72" y="190" width="352" height="230" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="248.0" y="240" font-size="30" font-weight="700" fill="#24213F" text-anchor="middle">Клиент</text>
<text x="248.0" y="284" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">принципал строит код</text>
<text x="248.0" y="314" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">из канала, не из текста;</text>
<text x="248.0" y="344" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">id клиента вырезан</text>
<text x="248.0" y="374" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">из схемы инструмента</text>
<rect x="464" y="190" width="352" height="230" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="640.0" y="240" font-size="30" font-weight="700" fill="#24213F" text-anchor="middle">Оператор</text>
<text x="640.0" y="284" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">отдельный принципал:</text>
<text x="640.0" y="314" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">rules:write, agent:admin</text>
<text x="640.0" y="344" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">правка идёт отдельным</text>
<text x="640.0" y="374" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">блоком в промпте</text>
<rect x="856" y="190" width="352" height="230" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="1032.0" y="240" font-size="30" font-weight="700" fill="#24213F" text-anchor="middle">Данные</text>
<text x="1032.0" y="284" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">чужие данные (база знаний,</text>
<text x="1032.0" y="314" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">веб) — в обёртке untrusted:</text>
<text x="1032.0" y="344" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">данные, а не инструкции</text>
<rect x="72" y="446" width="1136" height="118" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="640.0" y="492" font-size="26" font-weight="700" fill="#24213F" text-anchor="middle">Перед каждым вызовом инструмента</text>
<text x="640.0" y="536" font-size="21" font-weight="400" fill="#3F5F58" text-anchor="middle">принципал → scope → роль → подтверждение → тенант → субъект</text>
<path d="M248 428 L248 442" fill="none" stroke="#22B59A" stroke-width="4" stroke-linecap="round" marker-end="url(#mG)"/>
<path d="M640 428 L640 442" fill="none" stroke="#22B59A" stroke-width="4" stroke-linecap="round" marker-end="url(#mG)"/>
<path d="M1032 428 L1032 442" fill="none" stroke="#22B59A" stroke-width="4" stroke-linecap="round" marker-end="url(#mG)"/>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Модель только предлагает вызов, </tspan><tspan font-weight="700" fill="#4B3BDB">а разрешает его код</tspan><tspan></tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
