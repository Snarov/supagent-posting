<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-02-решение-доступ -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB">Права проверяет код, а не модель</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F">Что делает код с каждым источником ввода и что это гарантирует</text>
<text x="286" y="202" font-size="18" font-weight="700" fill="#5B4BEA" text-anchor="start">ЧТО ДЕЛАЕТ КОД</text>
<text x="762" y="202" font-size="18" font-weight="700" fill="#0B5C4D" text-anchor="start">ЧТО ЭТО ГАРАНТИРУЕТ</text>
<rect x="72" y="214" width="1136" height="108" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="100" y="278" font-size="30" font-weight="700" fill="#24213F" text-anchor="start">Клиент</text>
<text x="286" y="250" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">ID и учётную запись клиента</text>
<text x="286" y="278" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">в каждый вызов подставляет код.</text>
<text x="286" y="306" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">Модель их не видит и не выбирает.</text>
<rect x="742" y="226" width="454" height="84" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="762" y="261" font-size="21" font-weight="700" fill="#0B5C4D" text-anchor="start">Клиент получит только свои данные,</text>
<text x="762" y="289" font-size="21" font-weight="700" fill="#0B5C4D" text-anchor="start">что бы он ни написал в чате</text>
<rect x="72" y="332" width="1136" height="108" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="100" y="396" font-size="30" font-weight="700" fill="#24213F" text-anchor="start">Оператор</text>
<text x="286" y="368" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">Оператор — тот, кто вошёл</text>
<text x="286" y="396" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">под учётной записью оператора,</text>
<text x="286" y="424" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">а не тот, кто так назвался в чате.</text>
<rect x="742" y="344" width="454" height="84" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="762" y="379" font-size="21" font-weight="700" fill="#0B5C4D" text-anchor="start">Фраза «я оператор» в чате</text>
<text x="762" y="407" font-size="21" font-weight="700" fill="#0B5C4D" text-anchor="start">клиента не даёт никаких прав</text>
<rect x="72" y="450" width="1136" height="108" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="100" y="514" font-size="30" font-weight="700" fill="#24213F" text-anchor="start">Данные</text>
<text x="286" y="486" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">База знаний и страницы из интернета</text>
<text x="286" y="514" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">попадают к модели с пометкой</text>
<text x="286" y="542" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">«данные, а не инструкции».</text>
<rect x="742" y="462" width="454" height="84" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="762" y="497" font-size="21" font-weight="700" fill="#0B5C4D" text-anchor="start">Команда, спрятанная в чужом тексте,</text>
<text x="762" y="525" font-size="21" font-weight="700" fill="#0B5C4D" text-anchor="start">не получит прав: вызов проверит код</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Модель можно уговорить, </tspan><tspan font-weight="700" fill="#4B3BDB">код — нельзя</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
