<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-02а-слои-доступа -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F2A33A"/></marker></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB">Как устроены слои доступа</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F">Модель работает внутри двух слоёв обычного кода</text>
<rect x="72" y="214" width="156" height="104" rx="14" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="150" y="258" font-size="23" font-weight="700" fill="#24213F" text-anchor="middle">Клиент</text>
<text x="150" y="288" font-size="15" font-weight="600" fill="#615D85" text-anchor="middle">канал поддержки</text>
<path d="M232 266 L258 266" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="72" y="364" width="156" height="104" rx="14" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="150" y="408" font-size="23" font-weight="700" fill="#24213F" text-anchor="middle">Оператор</text>
<text x="150" y="438" font-size="15" font-weight="600" fill="#615D85" text-anchor="middle">учётная запись</text>
<path d="M232 416 L258 416" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="266" y="186" width="184" height="312" rx="14" fill="#DDF5EF" stroke="#22B59A" stroke-width="2.5"/>
<text x="358" y="216" font-size="16" font-weight="700" fill="#0B5C4D" text-anchor="middle">КОД · ВХОД</text>
<text x="358" y="258" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">определяет,</text>
<text x="358" y="284" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">кто пишет:</text>
<text x="358" y="310" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">по каналу,</text>
<text x="358" y="336" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">а не по тексту</text>
<text x="358" y="396" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">привязывает</text>
<text x="358" y="422" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">к чату</text>
<text x="358" y="448" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">ID клиента</text>
<path d="M454 342 L478 342" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="486" y="186" width="236" height="312" rx="14" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="604" y="216" font-size="16" font-weight="700" fill="#5B4BEA" text-anchor="middle">КОНТЕКСТ</text>
<rect x="500" y="232" width="208" height="74" rx="10" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="604" y="276" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">сообщения клиента</text>
<rect x="500" y="318" width="208" height="74" rx="10" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="604" y="350" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">правка оператора</text>
<text x="604" y="376" font-size="14" font-weight="600" fill="#24213F" text-anchor="middle">отдельным блоком</text>
<rect x="500" y="404" width="208" height="74" rx="10" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2.5"/>
<text x="604" y="436" font-size="19" font-weight="700" fill="#7A4A00" text-anchor="middle">данные</text>
<text x="604" y="462" font-size="14" font-weight="600" fill="#24213F" text-anchor="middle">с пометкой «не инструкции»</text>
<path d="M726 342 L750 342" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="758" y="186" width="136" height="312" rx="14" fill="#EEEBFF" stroke="#5B4BEA" stroke-width="2.5"/>
<text x="826" y="216" font-size="16" font-weight="700" fill="#4B3BDB" text-anchor="middle">МОДЕЛЬ</text>
<text x="826" y="262" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">пишет</text>
<text x="826" y="290" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">ответ и</text>
<text x="826" y="318" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">предлагает</text>
<text x="826" y="346" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">вызов</text>
<text x="826" y="374" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">инструмента</text>
<text x="826" y="440" font-size="17" font-weight="700" fill="#4B3BDB" text-anchor="middle">ID клиента</text>
<text x="826" y="464" font-size="17" font-weight="700" fill="#4B3BDB" text-anchor="middle">не видит</text>
<path d="M898 342 L922 342" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="930" y="186" width="278" height="196" rx="14" fill="#DDF5EF" stroke="#22B59A" stroke-width="2.5"/>
<text x="1069" y="216" font-size="16" font-weight="700" fill="#0B5C4D" text-anchor="middle">КОД · ВЫЗОВ</text>
<text x="1069" y="254" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">проверяет каждый вызов</text>
<text x="1069" y="279" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">и сам подставляет ID</text>
<text x="1069" y="304" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">и учётную запись клиента;</text>
<text x="1069" y="329" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">проверка не пройдена —</text>
<text x="1069" y="354" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">отказ</text>
<path d="M1069 384 L1069 410" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="930" y="416" width="278" height="82" rx="14" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="1069" y="450" font-size="20" font-weight="700" fill="#24213F" text-anchor="middle">Инструменты</text>
<text x="1069" y="478" font-size="18" font-weight="600" fill="#615D85" text-anchor="middle">и база знаний</text>
<path d="M930 470 L914 470 L914 530 L604 530 L604 494" fill="none" stroke="#F2A33A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mA)"/>
<rect x="680" y="514" width="148" height="32" rx="8" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2"/>
<text x="754" y="536" font-size="15" font-weight="700" fill="#7A4A00" text-anchor="middle">ответ инструмента</text>
<rect x="72" y="530" width="18" height="18" rx="4" fill="#DDF5EF" stroke="#22B59A" stroke-width="2.5"/>
<text x="98" y="546" font-size="17" font-weight="700" fill="#24213F" text-anchor="start">обычный код</text>
<rect x="230" y="530" width="18" height="18" rx="4" fill="#EEEBFF" stroke="#5B4BEA" stroke-width="2.5"/>
<text x="256" y="546" font-size="17" font-weight="700" fill="#24213F" text-anchor="start">нейросеть</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Модель предлагает вызов, </tspan><tspan font-weight="700" fill="#4B3BDB">а разрешает или отклоняет его код</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
