<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-02а-слои-доступа -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter><marker id="mA" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="18" markerHeight="18" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#F2A33A"/></marker></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB">Как устроены слои доступа</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F">Нейросеть зажата между двумя слоями обычного кода</text>
<rect x="72" y="190" width="168" height="62" rx="12" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="156" y="218" font-size="21" font-weight="700" fill="#24213F" text-anchor="middle">Клиент</text>
<text x="156" y="240" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">канал поддержки</text>
<rect x="72" y="262" width="168" height="62" rx="12" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="156" y="290" font-size="21" font-weight="700" fill="#24213F" text-anchor="middle">Оператор</text>
<text x="156" y="312" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">учётная запись</text>
<path d="M244 221 L276 241" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<path d="M244 293 L276 261" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="284" y="178" width="700" height="112" rx="14" fill="#DDF5EF" stroke="#22B59A" stroke-width="2.5"/>
<text x="310" y="206" font-size="18" font-weight="700" fill="#0B5C4D" text-anchor="start">СЛОЙ 1 · ОБЫЧНЫЙ КОД НА ВХОДЕ</text>
<text x="310" y="236" font-size="18" font-weight="700" fill="#24213F" text-anchor="start">• определяет, кто пишет: по каналу, а не по тексту сообщения</text>
<text x="310" y="260" font-size="18" font-weight="700" fill="#24213F" text-anchor="start">• привязывает к чату ID клиента</text>
<text x="310" y="284" font-size="18" font-weight="700" fill="#24213F" text-anchor="start">• помечает данные из инструментов как «не инструкции»</text>
<path d="M634 294 L634 326" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="344" y="332" width="580" height="104" rx="14" fill="#EEEBFF" stroke="#5B4BEA" stroke-width="2.5"/>
<text x="634" y="362" font-size="18" font-weight="700" fill="#4B3BDB" text-anchor="middle">НЕЙРОСЕТЬ</text>
<text x="634" y="392" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">пишет ответ и предлагает вызов инструмента</text>
<text x="634" y="418" font-size="18" font-weight="700" fill="#4B3BDB" text-anchor="middle">ID клиента не видит</text>
<path d="M634 440 L634 472" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="284" y="478" width="700" height="94" rx="14" fill="#DDF5EF" stroke="#22B59A" stroke-width="2.5"/>
<text x="310" y="504" font-size="18" font-weight="700" fill="#0B5C4D" text-anchor="start">СЛОЙ 2 · ОБЫЧНЫЙ КОД НА ВЫЗОВЕ</text>
<text x="310" y="532" font-size="18" font-weight="700" fill="#24213F" text-anchor="start">• проверяет каждый вызов; не прошёл проверку — отказ</text>
<text x="310" y="556" font-size="18" font-weight="700" fill="#24213F" text-anchor="start">• сам подставляет ID и учётную запись клиента</text>
<rect x="1040" y="478" width="168" height="94" rx="14" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="1124" y="516" font-size="20" font-weight="700" fill="#24213F" text-anchor="middle">Инструменты</text>
<text x="1124" y="542" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">и база знаний</text>
<path d="M988 525 L1034 525" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<path d="M1124 474 L1124 234 L990 234" fill="none" stroke="#F2A33A" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mA)"/>
<rect x="1044" y="330" width="160" height="56" rx="8" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2"/>
<text x="1124" y="354" font-size="18" font-weight="700" fill="#7A4A00" text-anchor="middle">ответ инструмента</text>
<text x="1124" y="374" font-size="18" font-weight="600" fill="#7A4A00" text-anchor="middle">возвращается в слой 1</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Модель предлагает вызов, </tspan><tspan font-weight="700" fill="#4B3BDB">а разрешает или отклоняет его код</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
