<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-02б-проверки-перед-вызовом -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB" text-anchor="start">Четыре проверки перед вызовом инструмента</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F" text-anchor="start">Проверяет код. Не пройдена хоть одна проверка — инструмент не вызывается</text>
<rect x="72" y="184" width="1136" height="84" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<circle cx="112" cy="226.0" r="20" fill="#5B4BEA"/>
<text x="112" y="234.0" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="152" y="234.0" font-size="23" font-weight="700" fill="#24213F" text-anchor="start">Кто вызывает</text>
<rect x="72" y="280" width="1136" height="84" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<circle cx="112" cy="322.0" r="20" fill="#5B4BEA"/>
<text x="112" y="330.0" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="152" y="318.0" font-size="23" font-weight="700" fill="#24213F" text-anchor="start">Какие инструменты</text>
<text x="152" y="346.0" font-size="23" font-weight="700" fill="#24213F" text-anchor="start">доступны</text>
<text x="430" y="318.0" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">Набор зависит от того, кто вызывает: неавторизованному клиенту</text>
<text x="430" y="346.0" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">только чтение, часть инструментов есть лишь у оператора</text>
<rect x="72" y="376" width="1136" height="84" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<circle cx="112" cy="418.0" r="20" fill="#5B4BEA"/>
<text x="112" y="426.0" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="152" y="414.0" font-size="23" font-weight="700" fill="#24213F" text-anchor="start">С какими правами</text>
<text x="152" y="442.0" font-size="23" font-weight="700" fill="#24213F" text-anchor="start">работает инструмент</text>
<text x="430" y="414.0" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">Инструмент работает с правами вызывающего: клиент — только</text>
<text x="430" y="442.0" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">со своим чатом и своими данными (ID клиента подставляет код)</text>
<rect x="72" y="472" width="1136" height="84" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<circle cx="112" cy="514.0" r="20" fill="#5B4BEA"/>
<text x="112" y="522.0" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="152" y="510.0" font-size="23" font-weight="700" fill="#24213F" text-anchor="start">Подтверждение</text>
<text x="152" y="538.0" font-size="23" font-weight="700" fill="#24213F" text-anchor="start">опасных действий</text>
<text x="430" y="510.0" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">Опасное действие не выполняется,</text>
<text x="430" y="538.0" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">пока оператор не ответит «да»</text>
<rect x="430" y="206.0" width="250" height="40" rx="20" fill="#DDF5EF" stroke="#22B59A" stroke-width="2.5"/>
<text x="555.0" y="232.0" font-size="18" font-weight="700" fill="#0B5C4D" text-anchor="middle">клиент · авторизован</text>
<rect x="694" y="206.0" width="270" height="40" rx="20" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2.5"/>
<text x="829.0" y="232.0" font-size="18" font-weight="700" fill="#7A4A00" text-anchor="middle">клиент · не авторизован</text>
<rect x="978" y="206.0" width="130" height="40" rx="20" fill="#EEEBFF" stroke="#5B4BEA" stroke-width="2.5"/>
<text x="1043.0" y="232.0" font-size="18" font-weight="700" fill="#4B3BDB" text-anchor="middle">оператор</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Что бы ни решила модель, </tspan><tspan font-weight="700" fill="#4B3BDB">последнее слово за кодом</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
