<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-04-решение-галлюцинации -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="600" fill="#4B3BDB" text-anchor="start">Каждый факт — со ссылкой на источник</text>
<text x="72" y="150" font-size="24" font-weight="400" fill="#615D85" text-anchor="start">Ссылки проверяет код, достаточность — отдельный вызов модели</text>
<rect x="72" y="200" width="300" height="140" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="222.0" y="248" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Генератор</text>
<text x="222.0" y="292" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">черновик и факты</text>
<text x="222.0" y="322" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">со ссылками</text>
<rect x="490" y="200" width="300" height="140" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="640.0" y="248" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Код</text>
<text x="640.0" y="292" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">ссылка только из</text>
<text x="640.0" y="322" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">списка этого хода</text>
<rect x="908" y="200" width="300" height="140" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="1058.0" y="248" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Оценщик</text>
<text x="1058.0" y="292" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">отдельный вызов,</text>
<text x="1058.0" y="322" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">свой контекст</text>
<path d="M380 270 L482 270" fill="none" stroke="#5B4BEA" stroke-width="4" stroke-linecap="round" marker-end="url(#mI)"/>
<path d="M798 270 L900 270" fill="none" stroke="#5B4BEA" stroke-width="4" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="72" y="384" width="520" height="180" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="96" y="430" font-size="26" font-weight="700" fill="#24213F" text-anchor="start">Источники</text>
<text x="96" y="473" font-size="20" font-weight="400" fill="#3F5F58" text-anchor="start">результат инструмента, память,</text>
<text x="96" y="502" font-size="20" font-weight="400" fill="#3F5F58" text-anchor="start">правило, прошлая реплика агента;</text>
<text x="96" y="531" font-size="20" font-weight="400" fill="#3F5F58" text-anchor="start">слова клиента — не источник</text>
<rect x="640" y="384" width="568" height="180" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="664" y="430" font-size="26" font-weight="700" fill="#A3223F" text-anchor="start">unsupported_fact</text>
<text x="664" y="474" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">блокирующая проблема:</text>
<text x="664" y="504" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">доработка, а если не помогло —</text>
<text x="664" y="534" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">эскалация на человека</text>
<path d="M1058 346 L1058 376" fill="none" stroke="#E5486B" stroke-width="4" stroke-linecap="round" marker-end="url(#mR)"/>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Слова клиента — контекст, а </tspan><tspan font-weight="700" fill="#4B3BDB">не доказательство факта</tspan><tspan></tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
