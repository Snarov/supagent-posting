<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-04-решение-галлюцинации -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB">Каждый факт — со ссылкой на источник</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F">Код проверяет, что ссылки настоящие, а оценщик — что источников хватает</text>
<rect x="72" y="182" width="360" height="214" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="252" y="228" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Генератор</text>
<text x="252" y="272" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">пишет черновик ответа</text>
<text x="252" y="302" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">и к каждому факту</text>
<text x="252" y="332" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">ставит ссылку</text>
<text x="252" y="362" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">на источник</text>
<rect x="460" y="182" width="360" height="214" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="640" y="228" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Код</text>
<text x="640" y="272" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">пропускает ссылку,</text>
<text x="640" y="302" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">только если агент</text>
<text x="640" y="332" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">действительно получил</text>
<text x="640" y="362" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">этот источник</text>
<rect x="848" y="182" width="360" height="214" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="1028" y="228" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Оценщик</text>
<text x="1028" y="272" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">отдельная модель:</text>
<text x="1028" y="302" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">проверяет, хватает ли</text>
<text x="1028" y="332" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">источников для</text>
<text x="1028" y="362" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">каждого факта</text>
<rect x="72" y="410" width="556" height="162" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="96" y="456" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">Что считается источником</text>
<text x="96" y="500" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">ответ инструмента, память, правило,</text>
<text x="96" y="530" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">прошлая реплика агента или оператора</text>
<rect x="652" y="410" width="556" height="162" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="676" y="456" font-size="24" font-weight="700" fill="#A3223F" text-anchor="start">Факт без источника</text>
<text x="676" y="500" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">ответ клиенту не уходит;</text>
<text x="676" y="527" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">у генератора одна попытка исправить,</text>
<text x="676" y="554" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">не получилось — эскалация на человека</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Слова клиента — контекст, а </tspan><tspan font-weight="700" fill="#4B3BDB">не доказательство факта</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
