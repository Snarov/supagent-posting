<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-06-решение-вопросы -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB" text-anchor="start">Агент ведёт учёт вопросов</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F" text-anchor="start">Список открытых вопросов есть и в контексте нейросети, и в коде</text>
<rect x="72" y="182" width="242" height="92" rx="16" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="193" y="222" font-size="22" font-weight="700" fill="#24213F" text-anchor="middle">Клиент задал</text>
<text x="193" y="250" font-size="22" font-weight="700" fill="#24213F" text-anchor="middle">новый вопрос</text>
<rect x="370" y="182" width="242" height="92" rx="16" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2.5"/>
<text x="491" y="222" font-size="22" font-weight="700" fill="#7A4A00" text-anchor="middle">Открытые</text>
<text x="491" y="250" font-size="22" font-weight="700" fill="#7A4A00" text-anchor="middle">вопросы</text>
<rect x="668" y="182" width="242" height="92" rx="16" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="789" y="222" font-size="22" font-weight="700" fill="#24213F" text-anchor="middle">Ответ ушёл</text>
<text x="789" y="250" font-size="22" font-weight="700" fill="#24213F" text-anchor="middle">клиенту</text>
<rect x="966" y="182" width="242" height="92" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2.5"/>
<text x="1087" y="222" font-size="22" font-weight="700" fill="#0B5C4D" text-anchor="middle">Закрытые</text>
<text x="1087" y="250" font-size="22" font-weight="700" fill="#0B5C4D" text-anchor="middle">вопросы</text>
<path d="M318 228 L364 228" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<path d="M616 228 L662 228" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<path d="M914 228 L960 228" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<text x="193" y="298" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">возникает по ходу чата</text>
<text x="491" y="298" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">ждёт ответа в списке</text>
<text x="789" y="298" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">сообщение отправлено</text>
<text x="1087" y="298" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">второй раз не отвечаем</text>
<rect x="72" y="326" width="556" height="238" rx="16" fill="#EEEBFF" stroke="#5B4BEA" stroke-width="2"/>
<text x="96" y="366" font-size="26" font-weight="700" fill="#4B3BDB" text-anchor="start">На уровне нейросети</text>
<text x="96" y="394" font-size="18" font-weight="600" fill="#24213F" text-anchor="start">учёт видно в самом запросе</text>
<text x="96" y="436" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">• в промпте: правило вести учёт вопросов</text>
<text x="96" y="470" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">• в контексте: история переписки</text>
<text x="96" y="504" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">• в контексте: список открытых вопросов</text>
<text x="96" y="538" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">• по ним видно, на что уже ответили</text>
<rect x="652" y="326" width="556" height="238" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="676" y="366" font-size="26" font-weight="700" fill="#0B5C4D" text-anchor="start">На уровне кода</text>
<text x="676" y="394" font-size="18" font-weight="600" fill="#24213F" text-anchor="start">учёт ведёт код, а не только модель</text>
<text x="676" y="436" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">• добавляет новый вопрос в список открытых</text>
<text x="676" y="470" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">• закрывает вопрос, когда ответ ушёл клиенту</text>
<text x="676" y="504" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">• не даёт ответить на один вопрос дважды</text>
<text x="676" y="538" font-size="20" font-weight="700" fill="#24213F" text-anchor="start">• все вопросы получают ответ</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Учёт вопросов закреплён и в промпте, и в коде: </tspan><tspan font-weight="700" fill="#4B3BDB">всё железно</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
