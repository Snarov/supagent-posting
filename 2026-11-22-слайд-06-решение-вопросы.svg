<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-06-решение-вопросы -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="600" fill="#4B3BDB" text-anchor="start">Склеиваем, судим, не отдаём неполный ответ</text>
<text x="72" y="150" font-size="24" font-weight="400" fill="#615D85" text-anchor="start">Четыре шага, и все — в коде хода</text>
<rect x="72" y="200" width="262" height="250" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="203.0" y="226" font-size="16" font-weight="700" fill="#615D85" text-anchor="middle">ШАГ 1</text>
<text x="203.0" y="266" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Пауза</text>
<text x="203.0" y="309" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">300 мс тишины;</text>
<text x="203.0" y="338" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">новое сообщение</text>
<text x="203.0" y="367" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">отменяет генерацию</text>
<path d="M338 325 L360 325" fill="none" stroke="#5B4BEA" stroke-width="4" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="362" y="200" width="262" height="250" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="493.0" y="226" font-size="16" font-weight="700" fill="#615D85" text-anchor="middle">ШАГ 2</text>
<text x="493.0" y="266" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Склейка</text>
<text x="493.0" y="309" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">все неотвеченные</text>
<text x="493.0" y="338" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">сообщения клиента</text>
<text x="493.0" y="367" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">идут одним текстом</text>
<path d="M628 325 L650 325" fill="none" stroke="#5B4BEA" stroke-width="4" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="652" y="200" width="262" height="250" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="783.0" y="226" font-size="16" font-weight="700" fill="#615D85" text-anchor="middle">ШАГ 3</text>
<text x="783.0" y="266" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Gate</text>
<text x="783.0" y="309" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">знает, что клиент</text>
<text x="783.0" y="338" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">дробит сообщения;</text>
<text x="783.0" y="367" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">приветствие плюс</text>
<text x="783.0" y="396" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">вопрос — полный ход</text>
<path d="M918 325 L940 325" fill="none" stroke="#5B4BEA" stroke-width="4" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="942" y="200" width="262" height="250" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="1073.0" y="226" font-size="16" font-weight="700" fill="#615D85" text-anchor="middle">ШАГ 4</text>
<text x="1073.0" y="266" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Оценщик</text>
<text x="1073.0" y="309" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">unanswered_question —</text>
<text x="1073.0" y="338" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">блокирующая</text>
<text x="1073.0" y="367" font-size="20" font-weight="400" fill="#615D85" text-anchor="middle">проблема</text>
<rect x="72" y="476" width="1136" height="90" rx="16" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="2"/>
<text x="640.0" y="529.05" font-size="23" font-weight="700" fill="#24213F" text-anchor="middle">Хвост обрывается на последнем доставленном ответе агента или оператора</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Полноту проверяет </tspan><tspan font-weight="700" fill="#4B3BDB">отдельный этап</tspan><tspan>, а не надежда на генератор</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
