<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-06а-склейка-и-проверка -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB" text-anchor="start">Склеиваем, проверяем, не отдаём неполный ответ</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F" text-anchor="start">Клиент пишет по кусочкам, поэтому ответ готовится только после паузы</text>
<rect x="72" y="182" width="208" height="270" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="176.0" y="214" font-size="18" font-weight="700" fill="#5B4BEA" text-anchor="middle">ШАГ 1</text>
<text x="176.0" y="252" font-size="26" font-weight="700" fill="#24213F" text-anchor="middle">Роутер</text>
<text x="176.0" y="296" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">понимает, что</text>
<text x="176.0" y="326" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">пришёл фрагмент,</text>
<text x="176.0" y="356" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">а не законченное</text>
<text x="176.0" y="386" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">сообщение</text>
<path d="M282 317 L300 317" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="304" y="182" width="208" height="270" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="408.0" y="214" font-size="18" font-weight="700" fill="#5B4BEA" text-anchor="middle">ШАГ 2</text>
<text x="408.0" y="252" font-size="26" font-weight="700" fill="#24213F" text-anchor="middle">Пауза</text>
<text x="408.0" y="296" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">агент не начинает</text>
<text x="408.0" y="326" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">генерацию, пока не</text>
<text x="408.0" y="356" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">поступят все</text>
<text x="408.0" y="386" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">сообщения клиента</text>
<path d="M514 317 L532 317" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="536" y="182" width="208" height="270" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="640.0" y="214" font-size="18" font-weight="700" fill="#5B4BEA" text-anchor="middle">ШАГ 3</text>
<text x="640.0" y="252" font-size="26" font-weight="700" fill="#24213F" text-anchor="middle">Склейка</text>
<text x="640.0" y="296" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">все сообщения без</text>
<text x="640.0" y="326" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">ответа читаются</text>
<text x="640.0" y="356" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">как один текст</text>
<path d="M746 317 L764 317" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="768" y="182" width="208" height="270" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="872.0" y="214" font-size="18" font-weight="700" fill="#5B4BEA" text-anchor="middle">ШАГ 4</text>
<text x="872.0" y="252" font-size="26" font-weight="700" fill="#24213F" text-anchor="middle">Генератор</text>
<text x="872.0" y="296" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">пишет черновик</text>
<text x="872.0" y="326" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">ответа на весь</text>
<text x="872.0" y="356" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">склеенный текст</text>
<path d="M978 317 L996 317" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="1000" y="182" width="208" height="270" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="1104.0" y="214" font-size="18" font-weight="700" fill="#5B4BEA" text-anchor="middle">ШАГ 5</text>
<text x="1104.0" y="252" font-size="26" font-weight="700" fill="#24213F" text-anchor="middle">Оценщик</text>
<text x="1104.0" y="296" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">если вопрос остался</text>
<text x="1104.0" y="326" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">без ответа,</text>
<text x="1104.0" y="356" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">черновик клиенту</text>
<text x="1104.0" y="386" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">не уходит</text>
<rect x="72" y="474" width="1136" height="90" rx="16" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2"/>
<text x="640" y="527" font-size="22" font-weight="700" fill="#7A4A00" text-anchor="middle">Склеиваем всё, что клиент написал после последнего ответа агента или оператора</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Полноту проверяет отдельный этап, </tspan><tspan font-weight="700" fill="#4B3BDB">а не надежда на генератор</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
