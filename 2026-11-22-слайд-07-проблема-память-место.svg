<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-07-проблема-память-место -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB" text-anchor="start">У записи в памяти нет места действия</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F" text-anchor="start">Запись из одного места попадает туда, где ей быть не должно</text>
<rect x="72" y="182" width="1136" height="100" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="96" y="212" font-size="18" font-weight="700" fill="#A3223F" text-anchor="start">СБОЙ 1 · КАНАЛ</text>
<text x="96" y="246" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">Инструкция для одного канала срабатывает в другом:</text>
<text x="96" y="272" font-size="21" font-weight="600" fill="#24213F" text-anchor="start">агент просит клиента о шаге, которого в этом канале просто нет</text>
<rect x="72" y="298" width="1136" height="190" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="96" y="328" font-size="18" font-weight="700" fill="#A3223F" text-anchor="start">СБОЙ 2 · КЛИЕНТ</text>
<rect x="96" y="348" width="244" height="124" rx="16" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="218.0" y="378" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">ШАГ 1</text>
<text x="218.0" y="406" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">Клиенту А</text>
<text x="218.0" y="430" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">пообещали скидку</text>
<path d="M343 410.0 L374 410.0" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="377" y="348" width="244" height="124" rx="16" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="499.0" y="378" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">ШАГ 2</text>
<text x="499.0" y="406" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">Запись о скидке</text>
<text x="499.0" y="430" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">сохранилась в памяти</text>
<text x="499.0" y="454" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">агента</text>
<path d="M624 410.0 L655 410.0" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="658" y="348" width="244" height="124" rx="16" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="780.0" y="378" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">ШАГ 3</text>
<text x="780.0" y="406" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">Запись попала в запрос</text>
<text x="780.0" y="430" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">при обслуживании</text>
<text x="780.0" y="454" font-size="19" font-weight="700" fill="#24213F" text-anchor="middle">клиента Б</text>
<path d="M905 410.0 L936 410.0" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="939" y="348" width="244" height="124" rx="16" fill="#FFFFFF" stroke="#F7B8C7" stroke-width="2.5"/>
<text x="1061.0" y="378" font-size="18" font-weight="700" fill="#A3223F" text-anchor="middle">РЕЗУЛЬТАТ</text>
<text x="1061.0" y="406" font-size="19" font-weight="700" fill="#A3223F" text-anchor="middle">Агент заговорил</text>
<text x="1061.0" y="430" font-size="19" font-weight="700" fill="#A3223F" text-anchor="middle">о скидке с клиентом Б</text>
<rect x="72" y="506" width="1136" height="64" rx="16" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2"/>
<text x="640" y="545" font-size="22" font-weight="700" fill="#7A4A00" text-anchor="middle">Про запись нужно знать, где она действует: в каком канале и для какого клиента</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Запись про одного клиента </tspan><tspan font-weight="700" fill="#4B3BDB">не должна попасть к другому</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
