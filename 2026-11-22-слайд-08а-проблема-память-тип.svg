<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-08а-проблема-память-тип -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB" text-anchor="start">У записи в памяти нет типа</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F" text-anchor="start">Образец ответа и факт в памяти выглядят одинаково</text>
<rect x="72" y="182" width="1136" height="284" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="96" y="214" font-size="18" font-weight="700" fill="#A3223F" text-anchor="start">СБОЙ · ПРИМЕР ПРИНЯТ ЗА ФАКТ</text>
<rect x="96" y="238" width="336" height="132" rx="16" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="264.0" y="266" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">В ПАМЯТИ · ОБРАЗЕЦ ОТВЕТА</text>
<text x="264.0" y="298" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">«Для IP 203.0.113.7 доступ</text>
<text x="264.0" y="324" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">заблокирован по решению</text>
<text x="264.0" y="350" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">Роскомнадзора от [дата] № [номер]»</text>
<rect x="472" y="238" width="336" height="132" rx="16" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="640.0" y="266" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">В ЗАПРОС</text>
<text x="640.0" y="298" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">образец вставлен как есть,</text>
<text x="640.0" y="324" font-size="18" font-weight="700" fill="#24213F" text-anchor="middle">без типа и без разметки</text>
<rect x="848" y="238" width="336" height="132" rx="16" fill="#FFFFFF" stroke="#F7B8C7" stroke-width="2.5"/>
<text x="1016.0" y="266" font-size="18" font-weight="700" fill="#A3223F" text-anchor="middle">РЕЗУЛЬТАТ</text>
<text x="1016.0" y="298" font-size="18" font-weight="700" fill="#A3223F" text-anchor="middle">Агент выдаёт конкретику образца</text>
<text x="1016.0" y="324" font-size="18" font-weight="700" fill="#A3223F" text-anchor="middle">за факт о другом клиенте:</text>
<text x="1016.0" y="350" font-size="18" font-weight="700" fill="#A3223F" text-anchor="middle">«ваш IP заблокирован»</text>
<path d="M436 304 L468 304" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<path d="M812 304 L844 304" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<text x="96" y="412" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">Образец нужен, чтобы агент повторил форму ответа,</text>
<text x="96" y="438" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">а агент достаёт из него конкретные факты и выдаёт за настоящие</text>
<rect x="72" y="486" width="1136" height="84" rx="16" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2"/>
<text x="640" y="520" font-size="23" font-weight="700" fill="#7A4A00" text-anchor="middle">Про каждую запись нужно знать, что это такое:</text>
<text x="640" y="550" font-size="21" font-weight="600" fill="#24213F" text-anchor="middle">факт, инструкция или образец ответа</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Образец показывает форму ответа, </tspan><tspan font-weight="700" fill="#4B3BDB">а не факты</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
