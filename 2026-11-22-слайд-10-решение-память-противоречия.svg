<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-10-решение-память-противоречия -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB" text-anchor="start">Субагент сверяет новую запись с памятью</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F" text-anchor="start">Сравнение с уже сохранённым идёт при записи, а не при поиске</text>
<rect x="72" y="182" width="300" height="100" rx="16" fill="#FFFFFF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="222" y="222" font-size="24" font-weight="700" fill="#24213F" text-anchor="middle">Новая запись</text>
<text x="222" y="252" font-size="18" font-weight="600" fill="#24213F" text-anchor="middle">например, правка оператора</text>
<path d="M376 232 L420 232" fill="none" stroke="#5B4BEA" stroke-width="3.5" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="424" y="182" width="784" height="100" rx="16" fill="#EEEBFF" stroke="#5B4BEA" stroke-width="2.5"/>
<text x="444" y="214" font-size="18" font-weight="700" fill="#4B3BDB" text-anchor="start">СУБАГЕНТ ПАМЯТИ</text>
<text x="444" y="246" font-size="22" font-weight="700" fill="#24213F" text-anchor="start">при записи ищет в памяти похожие по смыслу записи</text>
<text x="444" y="270" font-size="18" font-weight="600" fill="#24213F" text-anchor="start">и решает, что делать с новой</text>
<rect x="72" y="310" width="360" height="160" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2.5"/>
<text x="252" y="352" font-size="26" font-weight="700" fill="#0B5C4D" text-anchor="middle">Дополнить</text>
<text x="252" y="396" font-size="19" font-weight="600" fill="#24213F" text-anchor="middle">новая запись уточняет старую,</text>
<text x="252" y="424" font-size="19" font-weight="600" fill="#24213F" text-anchor="middle">обе остаются</text>
<rect x="460" y="310" width="360" height="160" rx="16" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2.5"/>
<text x="640" y="352" font-size="26" font-weight="700" fill="#7A4A00" text-anchor="middle">Заменить</text>
<text x="640" y="396" font-size="19" font-weight="600" fill="#24213F" text-anchor="middle">старая запись устарела,</text>
<text x="640" y="424" font-size="19" font-weight="600" fill="#24213F" text-anchor="middle">её заменяет новая</text>
<rect x="848" y="310" width="360" height="160" rx="16" fill="#F4F2FF" stroke="#B9B3E6" stroke-width="2.5"/>
<text x="1028" y="352" font-size="26" font-weight="700" fill="#4B3BDB" text-anchor="middle">Оставить как есть</text>
<text x="1028" y="396" font-size="19" font-weight="600" fill="#24213F" text-anchor="middle">новая запись ничего не добавляет,</text>
<text x="1028" y="424" font-size="19" font-weight="600" fill="#24213F" text-anchor="middle">память не меняется</text>
<rect x="72" y="490" width="1136" height="80" rx="16" fill="#FFF4DE" stroke="#F2A33A" stroke-width="2"/>
<text x="640" y="524" font-size="24" font-weight="700" fill="#7A4A00" text-anchor="middle">Субагент не уверен — решает человек (Human Gate)</text>
<text x="640" y="554" font-size="19" font-weight="600" fill="#24213F" text-anchor="middle">человек помогает принять решение: дополнить, заменить или оставить</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Противоречие разбирается в момент записи, </tspan><tspan font-weight="700" fill="#4B3BDB">а не копится</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
