<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-10а-правка-становится-уроком -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB">Правка оператора становится уроком</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F">Неверный ответ: правка сначала становится уроком, и по нему агент правит черновик</text>
<rect x="72" y="182" width="1136" height="70" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<circle cx="110" cy="217" r="19" fill="#5B4BEA"/>
<text x="110" y="225" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="148" y="212" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">Оператор жмёт «Редактировать»</text>
<text x="148" y="240" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">и обычными словами пишет, что в черновике не так</text>
<rect x="72" y="261" width="1136" height="70" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<circle cx="110" cy="296" r="19" fill="#5B4BEA"/>
<text x="110" y="304" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="148" y="291" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">Модель разбирает правку</text>
<text x="148" y="319" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">факт это или инструкция; субагент памяти сверяет её со старыми записями</text>
<rect x="72" y="340" width="1136" height="70" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<circle cx="110" cy="375" r="19" fill="#5B4BEA"/>
<text x="110" y="383" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="148" y="370" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">Оператор видит урок до применения</text>
<text x="148" y="398" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">может поправить текст, сменить тип или отменить урок</text>
<rect x="72" y="419" width="1136" height="70" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<circle cx="110" cy="454" r="19" fill="#5B4BEA"/>
<text x="110" y="462" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="148" y="449" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">Урок пока временный: действует только в этом чате</text>
<text x="148" y="477" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">агент правит черновик по записи в памяти, а не по словам оператора</text>
<rect x="72" y="498" width="1136" height="70" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<circle cx="110" cy="533" r="19" fill="#5B4BEA"/>
<text x="110" y="541" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="148" y="528" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">«Принять» — урок действует везде</text>
<text x="148" y="556" font-size="20" font-weight="600" fill="#24213F" text-anchor="start">старая запись выключается; «Отклонить» — временный урок удаляется</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Урок становится постоянным </tspan><tspan font-weight="700" fill="#4B3BDB">только после «Принять»</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
