<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-12-решение-кристаллизация -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="600" fill="#4B3BDB" text-anchor="start">Кристаллизация: от общего агента к тулу</text>
<text x="72" y="150" font-size="24" font-weight="400" fill="#615D85" text-anchor="start">Сначала открытая задача, потом то, что обкатано, закрепляется</text>
<rect x="72" y="200" width="260" height="160" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="202.0" y="248" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Задача</text>
<text x="202.0" y="292" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">нужное действие,</text>
<text x="202.0" y="322" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">тула ещё нет</text>
<rect x="390" y="200" width="400" height="160" rx="16" fill="url(#gInd)" stroke="none" stroke-width="0"/>
<text x="590.0" y="250" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Общий агент</text>
<text x="590.0" y="294" font-size="21" font-weight="400" fill="#E4E0FF" text-anchor="middle">трассы, скрипты, понимание</text>
<text x="590.0" y="324" font-size="21" font-weight="400" fill="#E4E0FF" text-anchor="middle">безопасного пути</text>
<path d="M338 280 L382 280" fill="none" stroke="#5B4BEA" stroke-width="4" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="848" y="190" width="360" height="106" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="1028.0" y="236" font-size="26" font-weight="700" fill="#24213F" text-anchor="middle">Тул</text>
<text x="1028.0" y="278" font-size="19" font-weight="400" fill="#3F5F58" text-anchor="middle">bm__get_payments, fetch_web</text>
<path d="M796 280 L844 243" fill="none" stroke="#22B59A" stroke-width="4" stroke-linecap="round" marker-end="url(#mG)"/>
<rect x="848" y="314" width="360" height="106" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="1028.0" y="360" font-size="26" font-weight="700" fill="#24213F" text-anchor="middle">Ядро</text>
<text x="1028.0" y="402" font-size="19" font-weight="400" fill="#3F5F58" text-anchor="middle">gate, оценщик, протокол хода</text>
<path d="M796 280 L844 367" fill="none" stroke="#22B59A" stroke-width="4" stroke-linecap="round" marker-end="url(#mG)"/>
<rect x="848" y="438" width="360" height="106" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="1028.0" y="484" font-size="26" font-weight="700" fill="#24213F" text-anchor="middle">Промпт и правила</text>
<text x="1028.0" y="526" font-size="19" font-weight="400" fill="#3F5F58" text-anchor="middle">профиль, rules, память</text>
<path d="M796 280 L844 491" fill="none" stroke="#22B59A" stroke-width="4" stroke-linecap="round" marker-end="url(#mG)"/>
<rect x="72" y="392" width="718" height="170" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="96" y="438" font-size="26" font-weight="700" fill="#24213F" text-anchor="start">Что это даёт</text>
<text x="96" y="482" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">артефакты прогона становятся</text>
<text x="96" y="512" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">кодом, а токены и стохастичность</text>
<text x="96" y="542" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">остаются там, где без них не обойтись</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Первое решение — на агенте, обкатанное — </tspan><tspan font-weight="700" fill="#4B3BDB">в код</tspan><tspan>: тул, ядро или промпт</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
