<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-14-решение-ядро-стенд -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="600" fill="#4B3BDB" text-anchor="start">Три этапа и стенд: каждое решение отдельно</text>
<text x="72" y="150" font-size="24" font-weight="400" fill="#615D85" text-anchor="start">Свой вход и свой прогон у gate, поиска памяти и оценщика</text>
<rect x="72" y="190" width="262" height="120" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="203.0" y="238" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Gate</text>
<text x="203.0" y="282" font-size="21" font-weight="400" fill="#3F5F58" text-anchor="middle">stage-run</text>
<path d="M338 250 L360 250" fill="none" stroke="#5B4BEA" stroke-width="4" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="362" y="190" width="262" height="120" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="493.0" y="259.8" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Контекст</text>
<path d="M628 250 L650 250" fill="none" stroke="#5B4BEA" stroke-width="4" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="652" y="190" width="262" height="120" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="783.0" y="238" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Генератор</text>
<text x="783.0" y="282" font-size="21" font-weight="400" fill="#615D85" text-anchor="middle">не нужен</text>
<path d="M918 250 L940 250" fill="none" stroke="#5B4BEA" stroke-width="4" stroke-linecap="round" marker-end="url(#mI)"/>
<rect x="942" y="190" width="262" height="120" rx="16" fill="#DDF5EF" stroke="#22B59A" stroke-width="2"/>
<text x="1073.0" y="238" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Оценщик</text>
<text x="1073.0" y="282" font-size="21" font-weight="400" fill="#3F5F58" text-anchor="middle">stage-run</text>
<rect x="72" y="340" width="556" height="226" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="96" y="388" font-size="28" font-weight="700" fill="#24213F" text-anchor="start">Стенд</text>
<text x="96" y="432" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">78 кейсов</text>
<text x="96" y="462" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">ответы инструментов и субагента</text>
<text x="96" y="492" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">записаны фикстурами</text>
<text x="96" y="522" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">в этапы идёт только то, что нужно</text>
<rect x="652" y="340" width="556" height="226" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="676" y="388" font-size="28" font-weight="700" fill="#24213F" text-anchor="start">Деньги и видимость</text>
<text x="676" y="432" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">потолок прогона $1, дальше — shrink</text>
<text x="676" y="462" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">проверка памяти: $0.004–0.014 на кейс</text>
<text x="676" y="492" font-size="21" font-weight="400" fill="#615D85" text-anchor="start">в трассе: токены и цена каждого этапа</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Поменял gate — </tspan><tspan font-weight="700" fill="#4B3BDB">прогнал gate</tspan><tspan>, а не весь ход</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
