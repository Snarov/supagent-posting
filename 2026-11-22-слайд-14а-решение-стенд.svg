<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Inter, 'Segoe UI', 'Helvetica Neue', Roboto, Arial, sans-serif">
<!-- слайд: 2026-11-22-слайд-14а-решение-стенд -->
<defs><marker id="mI" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#5B4BEA"/></marker><marker id="mR" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#E5486B"/></marker><marker id="mG" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#22B59A"/></marker><marker id="mW" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#FFFFFF"/></marker><marker id="mM" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#8B86B8"/></marker><linearGradient id="gInd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#3A1F9E"/></linearGradient><linearGradient id="gBar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5F4CEE"/><stop offset="1" stop-color="#2C1370"/></linearGradient><linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5F4CEE"/><stop offset="0.4" stop-color="#4B33D3"/><stop offset="1" stop-color="#2C1370"/></linearGradient><radialGradient id="gGlow"><stop offset="0" stop-color="#8C7DFF" stop-opacity="0.38"/><stop offset="0.65" stop-color="#8C7DFF" stop-opacity="0"/></radialGradient><radialGradient id="gShade"><stop offset="0" stop-color="#1E085A" stop-opacity="0.55"/><stop offset="0.7" stop-color="#1E085A" stop-opacity="0"/></radialGradient><filter id="sh" x="-5%" y="-30%" width="110%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#4B3BDB" flood-opacity="0.14"/></filter></defs>
<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB" text-anchor="start">Стенд: сценарии, прогоны и трейсы</text>
<text x="72" y="152" font-size="26" font-weight="600" fill="#24213F" text-anchor="start">Проверяем и настраиваем агента на записанных сценариях</text>
<rect x="72" y="176" width="1136" height="74" rx="16" fill="#EEEBFF" stroke="#5B4BEA" stroke-width="2.5"/>
<text x="96" y="204" font-size="18" font-weight="700" fill="#4B3BDB" text-anchor="start">СТЕНД (EVALS)</text>
<text x="96" y="236" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">набор записанных сценариев с желаемым входом и выходом</text>
<rect x="72" y="264" width="556" height="150" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="96" y="310" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">Прогоны и тюнинг</text>
<text x="96" y="342" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">прогоняем агента по сценариям,</text>
<text x="96" y="368" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">смотрим, как он себя ведёт, и</text>
<text x="96" y="394" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">подстраиваем параметры</text>
<rect x="652" y="264" width="556" height="150" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="676" y="310" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">Трейсы</text>
<text x="676" y="342" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">каждое действие агента</text>
<text x="676" y="368" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">записывается в трейс:</text>
<text x="676" y="394" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">вход, выход и цена</text>
<rect x="72" y="426" width="556" height="150" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="96" y="464" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">Этапы по отдельности</text>
<text x="96" y="496" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">у каждого этапа свой вход, поэтому</text>
<text x="96" y="522" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">части тестируем и тюним точечно,</text>
<text x="96" y="548" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">а не всё целиком</text>
<rect x="652" y="426" width="556" height="150" rx="16" fill="#F4F2FF" stroke="#E4E0FF" stroke-width="2"/>
<text x="676" y="464" font-size="24" font-weight="700" fill="#24213F" text-anchor="start">Деньги и видимость</text>
<text x="676" y="496" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">бюджет прогона задан заранее;</text>
<text x="676" y="522" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">ответы инструментов записаны,</text>
<text x="676" y="548" font-size="19" font-weight="600" fill="#24213F" text-anchor="start">живые системы не нужны</text>
<rect x="72" y="588" width="1136" height="76" rx="14" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="1.5" filter="url(#sh)"/>
<svg x="100" y="612" width="30" height="30" viewBox="0 0 24 24"><path fill="none" stroke="#5B4BEA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
<text x="152" y="635" font-size="25" fill="#24213F" xml:space="preserve"><tspan>Поменял роутер — </tspan><tspan font-weight="700" fill="#4B3BDB">прогнал роутер, а не всё целиком</tspan></text>
<rect x="0" y="710" width="1280" height="10" fill="url(#gBar)"/>
</svg>
