<rect width="1280" height="720" fill="#FFFFFF"/>
<text x="72" y="104" font-size="44" font-weight="700" fill="#4B3BDB" text-anchor="start">Агент читает чужие персональные данные</text>
<text x="72" y="150" font-size="24" font-weight="600" fill="#24213F" text-anchor="start">Персональные данные приходят к агенту из трёх источников</text>
<rect x="72" y="200" width="352" height="230" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="248.0" y="250" font-size="26" font-weight="700" fill="#A3223F" text-anchor="middle">В тексте сообщения</text>
<text x="248.0" y="296" font-size="23" font-weight="600" fill="#24213F" text-anchor="middle">email, телефон,</text>
<text x="248.0" y="328" font-size="23" font-weight="600" fill="#24213F" text-anchor="middle">номер договора</text>
<rect x="464" y="200" width="352" height="230" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="640.0" y="250" font-size="26" font-weight="700" fill="#A3223F" text-anchor="middle">На фото</text>
<text x="640.0" y="296" font-size="23" font-weight="600" fill="#24213F" text-anchor="middle">скан паспорта,</text>
<text x="640.0" y="328" font-size="23" font-weight="600" fill="#24213F" text-anchor="middle">документы</text>
<rect x="856" y="200" width="352" height="230" rx="16" fill="#FFF0F3" stroke="#F7B8C7" stroke-width="2"/>
<text x="1032.0" y="250" font-size="26" font-weight="700" fill="#A3223F" text-anchor="middle">Во внутренних системах</text>
<text x="1032.0" y="296" font-size="23" font-weight="600" fill="#24213F" text-anchor="middle">биллинг,</text>
<text x="1032.0" y="328" font-size="23" font-weight="600" fill="#24213F" text-anchor="middle">бухгалтерия</text>
<rect x="72" y="454" width="1136" height="112" rx="16" fill="#FFFFFF" stroke="#E4E0FF" stroke-width="2"/>
<text x="640.0" y="502" font-size="28" font-weight="700" fill="#24213F" text-anchor="middle">Всё прочитанное агент отправляет модели, а модель чужая</text>
<text x="640.0" y="547" font-size="22" font-weight="600" fill="#24213F" text-anchor="middle">данные уходят вместе с запросом, и вернуть их уже нельзя</text>
